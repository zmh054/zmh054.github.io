<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>云端计数器 · GitHub</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #e2e8f0;
  }
  .card {
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 40px 36px 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
  .subtitle { font-size: 13px; color: #94a3b8; margin: 4px 0 28px; }
  .value-box {
    text-align: center;
    padding: 28px 16px;
    border-radius: 16px;
    background: rgba(34, 197, 94, 0.12);
    border: 1px dashed rgba(34, 197, 94, 0.4);
    margin-bottom: 12px;
  }
  .value-label { font-size: 13px; color: #4ade80; letter-spacing: 3px; margin-bottom: 8px; }
  .value-number {
    font-size: 52px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #fff;
    line-height: 1.1;
  }
  .updated-time {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 10px;
  }
  .source-line {
    font-size: 12px;
    color: #94a3b8;
    text-align: center;
    margin-bottom: 16px;
  }
  .source-line .dot { color: #4ade80; }
  .source-line .dot.off { color: #f87171; }
  .reset-note {
    font-size: 12px;
    color: #94a3b8;
    text-align: center;
    margin-bottom: 20px;
  }
  .input-row { display: flex; gap: 10px; }
  input {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #22c55e; }
  input::placeholder { color: #64748b; }
  button {
    padding: 12px 22px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.2s;
    white-space: nowrap;
  }
  button:hover { transform: translateY(-1px); opacity: 0.92; }
  button:active { transform: translateY(0); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  button.ghost {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  .token-panel {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .link {
    cursor: pointer;
    text-decoration: underline;
    color: #94a3b8;
  }
  .link:hover { color: #4ade80; }
  #status {
    margin-top: 16px;
    font-size: 13px;
    min-height: 18px;
    text-align: center;
  }
  #status.ok { color: #4ade80; }
  #status.err { color: #f87171; }
  footer {
    margin-top: 22px;
    text-align: center;
    font-size: 12px;
    color: #64748b;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>云端计数器</h1>
    <div class="subtitle">GitHub Pages · GitHub API + Actions</div>

    <div class="value-box">
      <div class="value-label">当前值</div>
      <div class="value-number" id="current-value">--</div>
      <div class="updated-time" id="updated-time">尚未更新</div>
    </div>

    <div class="source-line" id="source-line"><span class="dot off">●</span> <span id="source-text">连接中…</span></div>
    <div class="reset-note">每天北京时间 04:00 自动清零</div>

    <div class="input-row">
      <input type="number" id="value-input" step="any" placeholder="输入新值（数字）" />
      <button id="set-btn">更新</button>
    </div>

    <div class="token-panel" id="token-panel" hidden>
      <input type="password" id="token-input" placeholder="粘贴 Fine-grained PAT（github_pat_ 开头）" />
      <button id="token-save-btn" class="ghost">保存</button>
    </div>

    <div id="status"></div>

    <footer>数据存储于 GitHub 仓库 · <span id="token-link" class="link">令牌设置</span></footer>
  </div>

  <script>
    // ============ 配置 ============
    var OWNER = 'zmh054';
    var REPO = 'zmh054.github.io';
    var FILE_PATH = 'data/counter.json';

    // 令牌从浏览器 localStorage 读取，不提交到仓库。
    // 首次使用：点击页面底部"令牌设置"，粘贴 GitHub fine-grained PAT。
    var GITHUB_TOKEN = localStorage.getItem('gh_token') || '';

    var RAW_URL = 'https://raw.githubusercontent.com/' + OWNER + '/' + REPO + '/main/' + FILE_PATH;
    var API_URL = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + FILE_PATH;
    var LS_KEY = 'cloud-counter-cache';
    var BEIJING_OFFSET_MS = 8 * 60 * 60 * 1000;
    var UPDATE_COOLDOWN_MS = 5 * 60 * 1000;

    // ============ DOM ============
    var valueEl = document.getElementById('current-value');
    var updatedTimeEl = document.getElementById('updated-time');
    var inputEl = document.getElementById('value-input');
    var btnEl = document.getElementById('set-btn');
    var statusEl = document.getElementById('status');
    var sourceEl = document.getElementById('source-text');
    var tokenPanel = document.getElementById('token-panel');
    var tokenInput = document.getElementById('token-input');
    var tokenSaveBtn = document.getElementById('token-save-btn');
    var tokenLink = document.getElementById('token-link');

    // ============ 状态 ============
    var lastUpdatedAt = null;
    var cooldownTimer = null;

    // ============ 工具函数 ============
    function showStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = type || '';
    }

    function setSource(text, ok) {
      sourceEl.textContent = text;
      var dot = document.querySelector('#source-line .dot');
      dot.className = 'dot' + (ok ? '' : ' off');
    }

    // 业务日：以北京时间 4:00 为日界
    function businessDate() {
      var d = new Date(Date.now() + BEIJING_OFFSET_MS - 4 * 60 * 60 * 1000);
      return d.toISOString().slice(0, 10);
    }

    function toBase64(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }

    function formatNumber(n) {
      return Number(n).toLocaleString('zh-CN', { maximumFractionDigits: 6 });
    }

    function formatTime(iso) {
      if (!iso) return '尚未更新';
      var d = new Date(iso);
      var bj = new Date(d.getTime() + BEIJING_OFFSET_MS);
      var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
      return bj.getUTCFullYear() + '-' + pad(bj.getUTCMonth() + 1) + '-' + pad(bj.getUTCDate()) +
        ' ' + pad(bj.getUTCHours()) + ':' + pad(bj.getUTCMinutes()) + ':' + pad(bj.getUTCSeconds());
    }

    function getCooldownRemaining(updatedAt) {
      if (!updatedAt) return 0;
      var elapsed = Date.now() - new Date(updatedAt).getTime();
      var remaining = UPDATE_COOLDOWN_MS - elapsed;
      return remaining > 0 ? remaining : 0;
    }

    function startCooldownCountdown(updatedAt) {
      if (cooldownTimer) { clearInterval(cooldownTimer); cooldownTimer = null; }
      if (!updatedAt) { btnEl.disabled = false; return; }
      var remaining = getCooldownRemaining(updatedAt);
      if (remaining <= 0) { btnEl.disabled = false; return; }
      function tick() {
        remaining = getCooldownRemaining(updatedAt);
        if (remaining <= 0) {
          clearInterval(cooldownTimer);
          cooldownTimer = null;
          btnEl.disabled = false;
          showStatus('冷却已结束，可以更新', 'ok');
          return;
        }
        btnEl.disabled = true;
        var mins = Math.floor(remaining / 60000);
        var secs = Math.floor((remaining % 60000) / 1000);
        var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
        showStatus('更新冷却中：剩余 ' + mins + ':' + pad(secs), 'err');
      }
      tick();
      cooldownTimer = setInterval(tick, 1000);
    }

    function fetchWithTimeout(url, ms, init) {
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, ms || 10000);
      return fetch(url, Object.assign({ signal: ctrl.signal }, init || {}))
        .then(function (r) { clearTimeout(timer); return r; })
        .catch(function (e) { clearTimeout(timer); throw e; });
    }

    function authHeaders() {
      return {
        'Authorization': 'Bearer ' + GITHUB_TOKEN,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28'
      };
    }

    // ============ 读取（API 优先，Raw 兜底） ============
    async function readValue() {
      var attempts = [
        {
          name: 'GitHub API',
          url: API_URL,
          headers: GITHUB_TOKEN ? authHeaders() : undefined,
          parse: async function (r) {
            var j = await r.json();
            if (!j || !j.content) throw new Error('bad api resp');
            return JSON.parse(atob(j.content));
          }
        },
        { name: 'GitHub Raw', url: RAW_URL, headers: undefined, parse: function (r) { return r.json(); } },
      ];

      var lastErr = null;
      for (var i = 0; i < attempts.length; i++) {
        var a = attempts[i];
        try {
          var res = await fetchWithTimeout(a.url, 10000, a.headers ? { headers: a.headers } : undefined);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          var data = await a.parse(res);
          if (!data || typeof data.value !== 'number') throw new Error('bad data');
          return { value: data.value, date: data.date, updatedAt: data.updatedAt, source: a.name };
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr || new Error('所有读取路径均失败');
    }

    // ============ 写入（GitHub Contents API） ============
    async function writeValue(value) {
      if (!GITHUB_TOKEN) {
        throw new Error('尚未配置 GitHub Token');
      }
      var now = new Date().toISOString();
      var body = JSON.stringify({ value: value, date: businessDate(), updatedAt: now });
      var sha = null;

      for (var attempt = 0; attempt < 3; attempt++) {
        try {
          var meta = await fetchWithTimeout(API_URL, 10000, { headers: authHeaders() });
          if (meta.ok) {
            var m = await meta.json();
            if (m && m.sha) sha = m.sha;
          }

          var res = await fetchWithTimeout(API_URL, 15000, {
            method: 'PUT',
            headers: authHeaders(),
            body: JSON.stringify({
              message: 'update counter',
              content: toBase64(body),
              sha: sha
            })
          });

          if (res.status === 409) { continue; }
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return { value: value, updatedAt: now };
        } catch (e) {
          if (attempt === 2) throw e;
        }
      }
      throw new Error('写入冲突，重试仍失败');
    }

    // ============ 页面逻辑 ============
    function renderValue(v, fromCache) {
      valueEl.textContent = formatNumber(v.value);
      updatedTimeEl.textContent = '上次修改：' + formatTime(v.updatedAt);
      var label = fromCache ? '（缓存）' : '';
      setSource('数据源：GitHub' + label, true);
      lastUpdatedAt = v.updatedAt || null;
      startCooldownCountdown(lastUpdatedAt);
    }

    async function loadValue() {
      showStatus('加载中…');
      var cache = null;
      try {
        cache = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
      } catch (e) {}

      try {
        var data = await readValue();
        if (data.date !== businessDate()) {
          data.value = 0;
          data.updatedAt = new Date().toISOString();
          writeValue(0).catch(function () {});
        }
        localStorage.setItem(LS_KEY, JSON.stringify(data));
        renderValue(data, false);
        if (!getCooldownRemaining(lastUpdatedAt)) {
          showStatus('已同步（' + data.source + '）', 'ok');
        }
      } catch (e) {
        if (cache && typeof cache.value === 'number') {
          renderValue(cache, true);
          showStatus('网络不可达，已显示上次缓存', 'err');
        } else {
          valueEl.textContent = '--';
          updatedTimeEl.textContent = '尚未更新';
          setSource('数据源：不可达', false);
          startCooldownCountdown(null);
          showStatus('加载失败：所有读取路径均不可达', 'err');
        }
      }
    }

    async function updateValue() {
      var raw = inputEl.value.trim();
      var value = Number(raw);
      if (raw === '' || !Number.isFinite(value)) {
        showStatus('请输入有效数字', 'err');
        return;
      }
      if (!GITHUB_TOKEN) {
        tokenPanel.hidden = false;
        tokenInput.focus();
        showStatus('请先设置 GitHub 令牌（见底部"令牌设置"）', 'err');
        return;
      }
      var remaining = getCooldownRemaining(lastUpdatedAt);
      if (remaining > 0) {
        startCooldownCountdown(lastUpdatedAt);
        return;
      }
      btnEl.disabled = true;
      showStatus('提交中…');
      try {
        var data = await writeValue(value);
        valueEl.textContent = formatNumber(data.value);
        updatedTimeEl.textContent = '上次修改：' + formatTime(data.updatedAt);
        lastUpdatedAt = data.updatedAt;
        localStorage.setItem(LS_KEY, JSON.stringify({ value: value, date: businessDate(), updatedAt: data.updatedAt }));
        inputEl.value = '';
        showStatus('更新成功', 'ok');
        startCooldownCountdown(data.updatedAt);
      } catch (e) {
        showStatus('更新失败：' + e.message, 'err');
        btnEl.disabled = false;
      }
    }

    // ============ 事件监听 ============
    btnEl.addEventListener('click', updateValue);
    inputEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') updateValue();
    });

    tokenLink.addEventListener('click', function () {
      tokenPanel.hidden = !tokenPanel.hidden;
      if (!tokenPanel.hidden) tokenInput.focus();
    });

    tokenSaveBtn.addEventListener('click', function () {
      var v = tokenInput.value.trim();
      if (!v) { showStatus('令牌不能为空', 'err'); return; }
      localStorage.setItem('gh_token', v);
      GITHUB_TOKEN = v;
      tokenInput.value = '';
      tokenPanel.hidden = true;
      showStatus('令牌已保存（仅存于本浏览器）', 'ok');
    });

    loadValue();
  </script>
</body>
</html>
