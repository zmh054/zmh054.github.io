name: 每日清零计数器

on:
  schedule:
    # UTC 20:00 = 北京时间次日 04:00
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 清零并提交
        run: |
          BEIJING_DATE=$(TZ='Asia/Shanghai' date -d '4 hours ago' +%F)
          UPDATED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          printf '{"value":0,"date":"%s","updatedAt":"%s"}\n' "$BEIJING_DATE" "$UPDATED_AT" > data/counter.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/counter.json
          git diff --cached --quiet || git commit -m "每日清零 (北京时间 $BEIJING_DATE)"
          git push
